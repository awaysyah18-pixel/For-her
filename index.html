<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You ♡</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: "Trebuchet MS", sans-serif;
            color: white;

            background:
                linear-gradient(
                    rgba(12, 5, 35, 0.25),
                    rgba(12, 5, 35, 0.45)
                ),
                url("background1.png") center/cover no-repeat;

            position: relative;
        }

        /* =========================
           DARK OVERLAY
        ========================== */

        body::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(
                    circle at center,
                    transparent 20%,
                    rgba(5, 0, 25, 0.45)
                );

            pointer-events: none;
            z-index: 1;
        }


        /* =========================
           TOP MUSIC
        ========================== */

        .top-music {
            position: absolute;
            top: 25px;
            left: 30px;

            display: flex;
            align-items: center;
            gap: 12px;

            font-size: 16px;
            z-index: 10;

            text-shadow: 0 0 10px #ff9de2;
        }

        .music-icon {
            font-size: 22px;
        }


        /* =========================
           FOR YOU
        ========================== */

        .for-you {
            position: absolute;
            top: 28px;
            right: 30px;

            font-size: 17px;
            font-style: italic;

            z-index: 10;

            text-shadow: 0 0 10px #ff9de2;
        }


        /* =========================
           MAIN CONTENT
        ========================== */

        .container {
            position: relative;

            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            z-index: 5;

            padding: 20px;
        }

        h1 {
            font-size: clamp(38px, 7vw, 72px);

            font-weight: 500;

            font-style: italic;

            letter-spacing: 1px;

            margin-bottom: 35px;

            color: #fff;

            text-shadow:
                0 0 8px #ff8bdc,
                0 0 20px #ff4fc4,
                0 0 45px rgba(255, 71, 193, 0.7);

            animation: titleGlow 3s ease-in-out infinite alternate;
        }


        @keyframes titleGlow {

            from {
                text-shadow:
                    0 0 8px #ff8bdc,
                    0 0 20px #ff4fc4;
            }

            to {
                text-shadow:
                    0 0 15px #ffffff,
                    0 0 30px #ff4fc4,
                    0 0 60px #ff4fc4;
            }
        }


        /* =========================
           DESCRIPTION
        ========================== */

        .subtitle {
            font-size: clamp(17px, 3vw, 25px);

            line-height: 1.6;

            font-style: italic;

            opacity: 0.9;

            margin-bottom: 35px;

            text-shadow: 0 0 12px rgba(255,255,255,0.5);
        }


        /* =========================
           BUTTON
        ========================== */

        .love-button {

            border: 1px solid rgba(255,255,255,0.5);

            padding: 17px 45px;

            border-radius: 50px;

            background:
                linear-gradient(
                    90deg,
                    rgba(255, 65, 148, 0.55),
                    rgba(255, 116, 190, 0.45)
                );

            color: white;

            font-size: 18px;

            font-style: italic;

            cursor: pointer;

            box-shadow:
                0 0 15px rgba(255, 66, 174, 0.5),
                inset 0 0 20px rgba(255,255,255,0.1);

            transition: 0.4s;

            backdrop-filter: blur(5px);
        }

        .love-button:hover {

            transform: scale(1.08);

            box-shadow:
                0 0 25px #ff54bd,
                0 0 60px rgba(255, 84, 189, 0.6);
        }

        .love-button:active {
            transform: scale(0.96);
        }


        /* =========================
           SECRET MESSAGE
        ========================== */

        #message {

            display: none;

            margin-top: 30px;

            max-width: 500px;

            font-size: 21px;

            line-height: 1.7;

            font-style: italic;

            animation: messageAppear 2s ease forwards;

            text-shadow:
                0 0 10px #ffb6e8,
                0 0 25px #ff5fc4;
        }


        @keyframes messageAppear {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================
           FLOATING EMOJIS
        ========================== */

        .floating {

            position: absolute;

            bottom: -60px;

            z-index: 3;

            pointer-events: none;

            user-select: none;

            animation:
                floatingUp linear forwards;

            filter:
                drop-shadow(0 0 8px rgba(255,255,255,0.7));
        }


        @keyframes floatingUp {

            0% {

                transform:
                    translateY(0)
                    translateX(0)
                    rotate(0deg)
                    scale(0.7);

                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            30% {

                transform:
                    translateY(-30vh)
                    translateX(20px)
                    rotate(80deg)
                    scale(1);
            }

            60% {

                transform:
                    translateY(-65vh)
                    translateX(-25px)
                    rotate(180deg)
                    scale(1.1);
            }

            100% {

                transform:
                    translateY(-115vh)
                    translateX(30px)
                    rotate(360deg)
                    scale(0.7);

                opacity: 0;
            }
        }


        /* =========================
           MUSIC PLAYER
        ========================== */

        .music-player {

            position: absolute;

            left: 25px;
            bottom: 25px;

            width: 360px;
            max-width: calc(100% - 50px);

            padding: 18px;

            border-radius: 20px;

            background:
                rgba(5, 0, 20, 0.55);

            border:
                1px solid rgba(255,255,255,0.15);

            backdrop-filter: blur(12px);

            box-shadow:
                0 0 30px rgba(0,0,0,0.4);

            z-index: 10;
        }


        .song-info {

            display: flex;

            align-items: center;

            gap: 15px;
        }


        .album {

            width: 55px;
            height: 55px;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #ff75bf,
                    #6e38c7
                );

            display: flex;

            justify-content: center;
            align-items: center;

            font-size: 25px;

            box-shadow:
                0 0 15px rgba(255,80,190,0.5);
        }


        .song-title {

            font-size: 17px;
        }


        .artist {

            font-size: 13px;

            opacity: 0.65;

            margin-top: 4px;
        }


        .controls {

            margin-left: auto;

            display: flex;

            gap: 12px;

            align-items: center;
        }


        .control {

            border: none;

            background: transparent;

            color: white;

            font-size: 20px;

            cursor: pointer;

            transition: 0.2s;
        }


        .control:hover {

            transform: scale(1.2);

            color: #ff8fd6;
        }


        .progress {

            width: 100%;

            height: 3px;

            margin-top: 15px;

            background: rgba(255,255,255,0.2);

            border-radius: 10px;

            overflow: hidden;
        }


        .progress-bar {

            width: 0%;

            height: 100%;

            background: #ff91d8;
        }


        /* =========================
           THANK YOU
        ========================== */

        .thank-you {

            position: absolute;

            right: 30px;
            bottom: 30px;

            text-align: right;

            font-style: italic;

            opacity: 0.8;

            z-index: 10;

            font-size: 17px;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            h1 {
                font-size: 40px;
            }

            .subtitle {
                font-size: 16px;
            }

            .love-button {
                padding: 14px 30px;
            }

            .music-player {

                left: 15px;
                bottom: 15px;

                width:
                    calc(100% - 30px);
            }

            .thank-you {
                display: none;
            }

            .top-music {
                left: 18px;
                top: 18px;
            }

            .for-you {
                right: 18px;
                top: 18px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================
         MUSIC
    ========================== -->

    <audio id="music" loop>

        <!--
        Upload file musik kamu dengan nama:
        rahasia-hati.mp3
        -->

        <source
            src="music.mp3"
            type="audio/mpeg"
        >

    </audio>


    <!-- TOP MUSIC -->

    <div class="top-music">

        <span class="music-icon">♫</span>

        <span>Rahasia Hati</span>

        <span id="topStatus">–</span>

    </div>


    <!-- TOP RIGHT -->

    <div class="for-you">

        For you ♡

    </div>


    <!-- MAIN -->

    <main class="container">

        <h1>
            I Hope<br>
            You Love Me Too ♡
        </h1>


        <div class="subtitle">

            There is something<br>
            I've been keeping<br>
            in my heart...

        </div>


        <button
            class="love-button"
            onclick="openHeart()"
        >

            💌 Open My Heart 💗

        </button>


        <div id="message">

            Maybe I can't say everything directly...

            <br><br>

            But there is one thing<br>
            I want you to know.

            <br><br>

            <strong>
                I hope you love me too. ♡
            </strong>

        </div>

    </main>


    <!-- MUSIC PLAYER -->

    <div class="music-player">

        <div class="song-info">

            <div class="album">
                ♫
            </div>


            <div>

                <div class="song-title">
                    Rahasia Hati
                </div>

                <div class="artist">
                    Music for you ♡
                </div>

            </div>


            <div class="controls">

                <button
                    class="control"
                    onclick="toggleMusic()"
                    id="playButton"
                >
                    ▶
                </button>

            </div>

        </div>


        <div class="progress">

            <div
                class="progress-bar"
                id="progressBar"
            ></div>

        </div>

    </div>


    <!-- THANK YOU -->

    <div class="thank-you">

        Thank you<br>
        for being you ♡

    </div>


    <script>

        const music =
            document.getElementById("music");

        const playButton =
            document.getElementById("playButton");

        const progressBar =
            document.getElementById("progressBar");

        const topStatus =
            document.getElementById("topStatus");


        /* =========================
           OPEN HEART
        ========================== */

        function openHeart() {

            music.play();

            playButton.innerHTML = "Ⅱ";

            topStatus.innerHTML = "♫";

            document.getElementById("message")
                .style.display = "block";

            createManyEmojis();

        }


        /* =========================
           PLAY / PAUSE
        ========================== */

        function toggleMusic() {

            if (music.paused) {

                music.play();

                playButton.innerHTML = "Ⅱ";

                topStatus.innerHTML = "♫";

            } else {

                music.pause();

                playButton.innerHTML = "▶";

                topStatus.innerHTML = "–";

            }

        }


        /* =========================
           FLOATING EMOJIS
        ========================== */

        function createEmoji() {

            const emoji =
                document.createElement("div");

            emoji.className = "floating";


            const emojis = [
                "✨",
                "💘",
                "🫶"
            ];


            emoji.innerHTML =
                emojis[
                    Math.floor(
                        Math.random() *
                        emojis.length
                    )
                ];


            emoji.style.left =
                Math.random() * 100 + "vw";


            emoji.style.fontSize =
                (18 + Math.random() * 28)
                + "px";


            emoji.style.animationDuration =
                (5 + Math.random() * 5)
                + "s";


            document.body.appendChild(emoji);


            setTimeout(() => {

                emoji.remove();

            }, 11000);

        }


        /* =========================
           INITIAL EMOJIS
        ========================== */

        function createManyEmojis() {

            for (
                let i = 0;
                i < 12;
                i++
            ) {

                setTimeout(
                    createEmoji,
                    i * 250
                );

            }

        }


        /* =========================
           CONTINUOUS EMOJIS
        ========================== */

        setInterval(
            createEmoji,
            650
        );


        /* =========================
           MUSIC PROGRESS
        ========================== */

        music.addEventListener(
            "timeupdate",
            function() {

                if (
                    music.duration &&
                    !isNaN(music.duration)
                ) {

                    const progress =
                        (
                            music.currentTime /
                            music.duration
                        ) * 100;


                    progressBar.style.width =
                        progress + "%";

                }

            }
        );


        /* =========================
           MUSIC ENDED
        ========================== */

        music.addEventListener(
            "play",
            function() {

                playButton.innerHTML = "Ⅱ";

                topStatus.innerHTML = "♫";

            }
        );


        music.addEventListener(
            "pause",
            function() {

                playButton.innerHTML = "▶";

                topStatus.innerHTML = "–";

            }
        );

    </script>

</body>
</html>
