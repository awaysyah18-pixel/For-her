<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Hope You Love Me Too ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: white;
}

.container {
    text-align: center;
    animation: fadeIn 2s ease;
    z-index: 2;
}

h1 {
    font-size: 42px;
    margin-bottom: 15px;
}

p {
    font-size: 20px;
    opacity: 0.85;
    margin-bottom: 30px;
}

button {
    padding: 14px 28px;
    border: none;
    border-radius: 30px;
    background: #ff4f81;
    color: white;
    font-size: 17px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
    background: #ff2f6d;
}

#message {
    margin-top: 25px;
    font-size: 22px;
    display: none;
    animation: fadeIn 1s ease;
}

.heart {
    position: absolute;
    bottom: -30px;
    font-size: 20px;
    animation: float 6s linear infinite;
    opacity: 0.8;
}

@keyframes float {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>I Hope You Love Me Too ❤️</h1>

    <p>
        Maybe I don't say it enough,<br>
        but you mean something special to me.
    </p>

    <button onclick="showMessage()">Click Me 💌</button>

    <div id="message">
        Whatever happens,<br>
        I hope this little message makes you smile. ❤️
    </div>
</div>

<script>
function showMessage() {
    document.getElementById("message").style.display = "block";
}

function createHeart() {
    const heart = document.createElement("div");

    heart.classList.add("heart");
    heart.innerHTML = "❤️";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (15 + Math.random() * 25) + "px";
    heart.style.animationDuration = (4 + Math.random() * 4) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 8000);
}

setInterval(createHeart, 400);
</script>

</body>
</html>
